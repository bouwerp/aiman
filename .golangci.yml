version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # govet, errcheck, staticcheck, unused and ineffassign are the v2 defaults;
    # listed explicitly so the set is readable rather than implied.
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - copyloopvar
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - gosec
    - gocritic

  settings:
    gocyclo:
      min-complexity: 50
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - dupImport
        - emptyStringTest
        - hexLiteral
        - methodExprCall
        - stringXbytes
        - typeUnparen
        - unnecessaryBlock
        - yodaStyleExpr

  exclusions:
    # v1 applied these by default (exclude-use-default). v2 requires opting in,
    # so name them to keep the enforced set the same across the migration
    # rather than silently widening it.
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - vendor
    rules:
      # Tests trade these off deliberately: table-driven cases get long, and
      # ignoring errors or using weak randomness in a fixture is not a finding.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
      # Interface implementations often cannot use every parameter.
      - linters:
          - unparam
        text: "is unused"

formatters:
  enable:
    - gofmt

openapi: 3.1.0
info:
  title: aiman gateway
  version: 0.3.0
  description: >
    HTTP and WebSocket surface in front of `aiman serve`. Every request needs
    a bearer token except GET /v1/health and POST /v1/pair. The token is the
    host token (full access, used by the TUI) or a device token minted by
    POST /v1/pair. Device tokens pass a method allowlist on /v1/rpc, deny by
    default; destructive methods, the terminal WebSocket and to-do edits that
    close, drop, rename or remove a gate item also need the device's
    allow_destructive flag. Every request also passes the tailnet identity check. POST /v1/rpc
    is the whole API; REST reads are conveniences over the same socket
    methods.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: rpc
  - name: sessions
  - name: events
  - name: terminal
  - name: pairing
  - name: devices
paths:
  /v1/health:
    get:
      tags: [health]
      security: []
      operationId: health
      summary: Unauthenticated liveness. No version, no session data.
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/pair:
    post:
      tags: [pairing]
      security: []
      operationId: pair
      summary: >
        Redeem a pairing code from `aiman-gateway pair` for a device token.
        Needs no bearer token but still the tailnet identity check. The code
        is single use and valid 5 minutes. More than 5 failed codes in a
        minute lock pairing for the rest of that minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Code consumed; the token is shown only here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          description: Invalid JSON (invalid_params)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: Unknown, used or expired code (invalid_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "403":
          description: No tailnet identity, or login not on the allow-list (forbidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "429":
          description: Pairing locked after too many failed codes (locked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "503":
          description: Pairing is not configured on this gateway (unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Paired devices. Token hashes are never returned.
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: unauthorized
        "403":
          description: forbidden
  /v1/devices/{id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: >
        Revoke a device; its token stops working at once. A device token may
        revoke itself; revoking another device takes the host token or
        allow_destructive.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          description: unauthorized
        "403":
          description: Revoking another device without allow_destructive (forbidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "404":
          description: No such device (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
  /v1/rpc:
    post:
      tags: [rpc]
      operationId: rpc
      summary: JSON-RPC-shaped proxy onto the unix socket, plus gateway-owned push methods.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RpcRequest"
      responses:
        "200":
          description: Socket result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "400":
          description: Invalid JSON, missing method, streaming method used over RPC, or socket-level error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: Missing or wrong bearer token
        "403":
          description: >
            Tailnet WhoIs failed, login not on the allow-list, a device token
            calling a method outside its allowlist, or a device without
            allow_destructive closing, dropping, renaming or removing a gate
            to-do through todo.update or todo.remove
        "502":
          description: Unix socket call failed
  /v1/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: session.list over GET.
      parameters:
        - in: query
          name: group
          schema:
            type: string
      responses:
        "200":
          description: session.list result wrapped in RpcResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: unauthorized
        "403":
          description: forbidden
  /v1/sessions/{id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: session.get over GET.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: session.get result wrapped in RpcResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: unauthorized
  /v1/sessions/{id}/terminal:
    get:
      tags: [terminal]
      operationId: attachTerminal
      summary: >
        WebSocket bridge of pty.attach. A device token needs allow_destructive.
        Phone UI is deferred.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: cols
          schema:
            type: integer
            default: 80
        - in: query
          name: rows
          schema:
            type: integer
            default: 24
        - $ref: "#/components/parameters/AccessToken"
      responses:
        "101":
          description: Switching protocols
        "401":
          description: unauthorized
        "403":
          description: Tailnet identity check failed, or a device without allow_destructive (forbidden)
  /v1/events:
    get:
      tags: [events]
      operationId: sessionEvents
      summary: >
        WebSocket of SessionEvent objects, one JSON text frame per event.
        Events are changes, not snapshots. Expect a keepalive roughly every 20s.
      parameters:
        - $ref: "#/components/parameters/AccessToken"
      responses:
        "101":
          description: Switching protocols
        "401":
          description: unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccessToken:
      in: query
      name: access_token
      required: false
      description: >
        Bearer token for WebSocket clients that cannot set a header. URLs
        carrying it are never logged.
      schema:
        type: string
    SessionId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    AgentState:
      type: string
      enum:
        - waiting_input
        - working
        - waiting_background
        - idle
        - exited
        - errored
        - unknown
    StateConfidence:
      type: string
      enum: [high, low]
    Session:
      type: object
      required: [id, name, group, self]
      properties:
        limits:
          $ref: "#/components/schemas/LimitsReading"
          description: >
            What is left at the provider behind this session's agent. Only
            session.get fills it. Absent when the agent has no source, or until
            its source finishes a first run; ask again on the next poll.
        id:
          type: string
        name:
          type: string
        group:
          type: string
        parent_id:
          type: string
          description: The session that created this one; empty for a top-level session.
        role:
          type: string
          description: >
            Empty for an ordinary session. reviewer, handover and consult are
            aiman's hidden helpers: session.restart and session.terminate
            refuse them. fixer is visible: it pushes fixes to a PR.
        fix_pr:
          type: string
          description: owner/repo#n for a fixer session; empty otherwise.
        issue_key:
          type: string
        branch:
          type: string
        base_branch:
          type: string
          description: The ref the session's branch was cut from.
        repo_name:
          type: string
        tmux_session:
          type: string
          description: Terminal name; key kept for compatibility.
        worktree_path:
          type: string
        working_directory:
          type: string
        agent_name:
          type: string
        launch_model:
          type: string
          description: Model this session launches with; empty is the agent's default.
        launch_effort:
          type: string
        agent_session_id:
          type: string
        agent_session_path:
          type: string
        title:
          type: string
          description: Agent-set terminal title; the one-line "what is it doing".
        status:
          type: string
        state:
          $ref: "#/components/schemas/AgentState"
        state_confidence:
          $ref: "#/components/schemas/StateConfidence"
        state_message:
          type: string
        state_source:
          type: string
        ended:
          type: boolean
        self:
          type: boolean
    RpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Serve's codes, plus invalid_code, locked, forbidden and internal,
            which the gateway returns itself. unavailable comes from either;
            from serve it means repo.list failed with nothing cached.
            worktree_dirty refuses session.terminate while removing the
            worktree would lose work, and data says what. needs_operator
            refuses a session's call to session.restart or session.terminate.
            session_scope refuses a session's pty.create, pty.input, pty.run,
            pty.kill, pty.forget, session.prompt, session.forget or steer.send
            on anything but itself, a descendant or its own helper pty, except
            that session.prompt and steer.send (mode note) to a visible session
            outside the tree are queued as a peer note while
            sessions.peer_notes is on; the ledger records session.peer_note on
            both sessions. peer_queue_full refuses a peer note while the target
            holds 8 undelivered peer notes from the sender or 16 from anyone.
            legacy_terminal refuses both on a legacy tmux row. A serve older
            than this spec answers a method it does not have with
            invalid_params and the message "unknown method <name>"; an older
            gateway answers a method missing from its allowlist with
            forbidden. The review.fix, review.push, review.assess and
            review.approve methods are not on the device allowlist. Their
            refusals: review_fix_fork (the PR is from a fork),
            review_fix_running (a fixer is running), review_fix_limit (three
            rounds used), review_fix_incomplete and review_fix_scope
            (review.push: missing commits, report or a path outside the
            findings' files), review_own_pr (the gh login opened the PR),
            review_blocking_open, review_not_assessed,
            review_assessment_rejected and review_already_approved
            (review.approve), plus review_not_ready, review_incomplete,
            review_head_moved and gate_needs_operator (gate:approve is closed
            only by an operator todo.update). aws.login_start refuses with
            aws_no_sso (the delegation has no SSO facts), aws_rate_limited
            (too many pending logins or recent starts), invalid_params (the
            profile is not delegated) and needs_operator (a session caller).
            aws.login_status answers not_found for a login id serve no longer
            holds. aws.log answers needs_operator for a session caller. Until their handlers land, the aws.* methods answer
            unavailable. session.transcript, session.transcript_item and
            session.process_output answer unavailable on a serve with no
            transcript reader, not_found for an unknown session, item or
            process, session_scope for a session caller outside its own tree,
            and serve's own forbidden when a process output path resolves
            outside the session's directories. session.file answers
            unavailable for a session with no worktree or working directory,
            forbidden for a path outside them, under a .git directory or
            named like a secret, not_found for a missing file,
            invalid_params for a directory, and session_scope for a session
            caller outside its own tree.
          enum:
            - invalid_params
            - not_found
            - name_taken
            - server_not_running
            - already_running
            - agent_blocked
            - timeout
            - create_failed
            - publish_failed
            - jira_unavailable
            - protocol_mismatch
            - no_reviewer_agent
            - no_preferred_agent
            - legacy_terminal
            - gate_needs_operator
            - design_not_approved
            - consult_needs_smart
            - review_exists
            - review_not_ready
            - review_incomplete
            - review_head_moved
            - review_already_posted
            - review_no_coverage
            - review_fix_fork
            - review_fix_running
            - review_fix_limit
            - review_fix_incomplete
            - review_fix_scope
            - review_own_pr
            - review_blocking_open
            - review_not_assessed
            - review_assessment_rejected
            - review_already_approved
            - worktree_dirty
            - needs_operator
            - session_scope
            - aws_no_sso
            - aws_rate_limited
            - unavailable
            - invalid_code
            - locked
            - forbidden
            - internal
        message:
          type: string
        data:
          description: The refusal's detail, for the codes that have one.
          oneOf:
            - $ref: "#/components/schemas/WorktreeDirtyData"
    WorktreeDirtyData:
      type: object
      description: >
        What removing the worktree would lose. aiman's own scaffolding
        (.aiman_* files, the bundled skill, graphify-out, its .gitignore rule)
        does not count, and neither do files the repository ignores, which
        removal also deletes.
      required: [changed_files, paths, unpushed_commits]
      properties:
        changed_files:
          type: integer
          description: Uncommitted and untracked files, all of them.
        paths:
          type: array
          maxItems: 20
          description: Up to 20 of the changed files.
          items:
            type: string
        unpushed_commits:
          type: integer
          description: Commits on HEAD that no remote-tracking ref contains.
    RpcRequest:
      type: object
      required: [method]
      properties:
        id:
          type: string
        method:
          type: string
          description: >
            Every method serve answers on its socket, plus push.register and
            push.unregister, which the gateway answers itself. Device tokens
            reach only the allowlisted subset; the rest return 403.
          enum:
            - ping
            - session.list
            - session.get
            - session.read
            - session.transcript
            - session.transcript_item
            - session.process_output
            - session.file
            - session.log
            - session.replay
            - session.prompt
            - session.wait
            - session.create
            - session.rename
            - session.move
            - session.forget
            - session.restart
            - session.terminate
            - repo.list
            - host.stats
            - host.version
            - host.update
            - session.register
            - session.report_agent_session
            - notify.since
            - verify.start
            - verify.status
            - ci.get
            - ci.watch
            - context.put
            - context.get
            - context.list
            - context.find
            - context.pack
            - context.stats
            - context.verify
            - usage.get
            - limits.get
            - aws.status
            - aws.login_start
            - aws.login_status
            - aws.log
            - agents.status
            - agents.update
            - agents.move_prefix
            - design.publish
            - review.reveal
            - review.post
            - review.refresh
            - review.run
            - review.debug
            - review.coverage
            - review.fix
            - review.push
            - review.assess
            - review.approve
            - handover.write
            - handover.point
            - memory.jobs
            - memory.done
            - todo.get
            - todo.summary
            - todo.add
            - todo.update
            - todo.move
            - todo.remove
            - todo.mirror
            - todo.ensure_done
            - todo.mark_met
            - todo.gate
            - todo.approve_design
            - todo.approve_review
            - steer.send
            - pty.create
            - pty.list
            - pty.get
            - pty.input
            - pty.run
            - pty.wait-output
            - pty.capture
            - pty.resize
            - pty.kill
            - pty.forget
            - push.register
            - push.unregister
        params:
          $ref: "#/components/schemas/RpcParams"
    StreamMethod:
      type: string
      description: >
        Socket methods that take over the connection instead of answering
        once. /v1/rpc refuses them; pty.attach is reached through
        /v1/sessions/{id}/terminal and session.events through /v1/events.
      enum:
        - pty.attach
        - session.events
    RpcParams:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        group:
          type: string
        lines:
          type: integer
        text:
          type: string
        force:
          type: boolean
          description: >
            Override the default refusal. Phone UX confirms before sending
            force true. Against today's unix socket, answering a
            waiting_input session also requires force true.
        token:
          type: string
          description: Expo push token. Never log this value.
        session:
          type: string
          description: >
            Target of session.restart and session.terminate (id or name). Every
            method that takes id also takes session; id wins when both are sent,
            except on session.transcript_item and session.process_output, where
            session names the session and id the item or process.
        subagent:
          type: string
          description: >
            session.transcript, session.transcript_item and
            session.process_output: a sub-agent id from a subagent item; empty
            reads the parent conversation.
        before:
          type: string
          description: >
            session.transcript: an opaque cursor from a reply's before; returns
            the page above it. Exclusive with after (invalid_params).
        after:
          type: string
          description: >
            session.transcript: an opaque cursor from a reply's after; returns
            new items, changed items and removed ids past it. A reply cut by
            the limit or the 2 MiB cap stops short of the end: call again with
            its after until a reply is empty.
        limit:
          type: integer
          description: >
            session.transcript page size; default 50, maximum 200. aws.log:
            the most rows to return; 0 or absent is the ledger's default.
            session.file: the most bytes of data; default 65536, capped at
            262144.
        path:
          type: string
          description: >
            session.file, required. Absolute, or relative to the session's
            working directory. Served only inside the session's worktree or
            working directory after symlinks; never a path with a .git
            element or a base name .env, .env.*, *.pem, *.key, id_rsa*,
            id_ed25519* or credentials (forbidden).
        offset:
          type: integer
          format: int64
          description: >
            session.file: byte offset to read from; default 0. Past the end
            answers empty data with eof true. The next page starts at the
            reply's offset plus the byte length of its data.
        since_seq:
          type: integer
          format: int64
          description: aws.log, the rows after this ledger seq; absent starts at the first.
        since:
          type: integer
          format: int64
          description: >
            session.process_output: byte offset to read from; absent reads the
            last 256 KiB.
        discard:
          type: boolean
          description: >
            session.terminate: remove a linked worktree even though it holds
            uncommitted changes or unpushed commits (git worktree remove
            --force). The branch is never deleted. Send it only after showing
            the worktree_dirty data and confirming.
        agent:
          type: string
          description: >
            session.create: agent command from agents.status; empty picks from
            the model tiers. session.restart: required; a different agent than
            the session's is a switch, which clears the launch model, effort and
            vendor identity, and an agent not installed is invalid_params.
        model:
          type: string
          description: >
            Launch model for session.create and session.restart. Needs agent on
            create. On a same-agent restart, empty keeps the session's model.
        effort:
          type: string
          description: Launch effort, with the same rules as model.
        repo:
          type: string
          description: session.create, owner/name from repo.list. Required unless quick.
        branch:
          type: string
          description: session.create. Empty derives it from name, adding a suffix if that worktree exists. A branch or a name is required unless quick.
        existing_branch:
          type: boolean
          description: session.create starts from this existing branch instead of cutting one.
        base:
          type: string
          description: session.create, the ref to cut the branch from.
        quick:
          type: boolean
          description: session.create, an ad-hoc session with no repository or worktree.
        prompt:
          type: string
          description: session.create, the agent's first prompt, delivered before create answers.
        name:
          type: string
          description: Free text. session.create or session.rename; session.create uses the branch when empty, and q1, q2 and so on for quick.
        tier:
          type: string
          enum: [smart, worker]
          description: session.create, exclusive with agent. A session the user starts defaults to smart.
        dir:
          type: string
          description: session.create, the subdirectory the agent starts in.
        issue:
          type: string
          description: session.create, the JIRA key.
        check:
          type: boolean
          description: >
            aws.status: also confirm each credential works with
            get-caller-identity.
        profile:
          type: string
          description: aws.login_start, required. The delegated AWS profile to sign in.
        login_id:
          type: string
          description: aws.login_status, required. From the aws.login_start result.
        device_id:
          type: string
        states:
          type: array
          items:
            $ref: "#/components/schemas/AgentState"
    RpcResponse:
      type: object
      properties:
        id:
          type: string
        result:
          oneOf:
            - $ref: "#/components/schemas/PongResult"
            - $ref: "#/components/schemas/SessionListResult"
            - $ref: "#/components/schemas/SessionGetResult"
            - $ref: "#/components/schemas/PaneReadResult"
            - $ref: "#/components/schemas/TranscriptPage"
            - $ref: "#/components/schemas/TranscriptItemResult"
            - $ref: "#/components/schemas/ProcessOutputResult"
            - $ref: "#/components/schemas/FileResult"
            - $ref: "#/components/schemas/PromptResult"
            - $ref: "#/components/schemas/PushRegisterResult"
            - $ref: "#/components/schemas/PushUnregisterResult"
            - $ref: "#/components/schemas/RepoListResult"
            - $ref: "#/components/schemas/SessionTerminatedResult"
            - $ref: "#/components/schemas/HostStatsResult"
            - $ref: "#/components/schemas/HostVersionResult"
            - $ref: "#/components/schemas/HostUpdateResult"
            - $ref: "#/components/schemas/LimitsResult"
            - $ref: "#/components/schemas/AWSStatusResult"
            - $ref: "#/components/schemas/AWSLoginResult"
            - $ref: "#/components/schemas/AWSLogResult"
            - $ref: "#/components/schemas/AgentsStatusResult"
            - $ref: "#/components/schemas/ReviewFixResult"
            - $ref: "#/components/schemas/ReviewPushResult"
            - $ref: "#/components/schemas/ReviewAssessResult"
            - $ref: "#/components/schemas/ReviewApprovedResult"
        error:
          $ref: "#/components/schemas/RpcError"
    PongResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pong
        version:
          type: string
        protocol:
          type: integer
    SessionListResult:
      type: object
      required: [type, sessions]
      properties:
        type:
          type: string
          const: session_list
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    AgentsStatusResult:
      type: object
      required: [type, host, mode, window, agents]
      properties:
        type:
          type: string
          const: agents
        host:
          type: string
        mode:
          type: string
        window:
          type: string
        agents:
          type: array
          items:
            type: object
            required: [agent, status]
            properties:
              agent:
                type: string
                description: The command session.create and session.restart take.
              status:
                type: string
              models:
                type: array
                description: >
                  The agent's launch catalog. Absent for an agent with no fixed
                  list, such as Pi, which lists its models at run time.
                items:
                  type: string
    RepoListResult:
      type: object
      description: >
        Cached for 5 minutes. A failed refresh serves the last list; a failure
        with nothing cached is unavailable.
      required: [type, repos]
      properties:
        type:
          type: string
          const: repos
        repos:
          type: array
          items:
            type: object
            required: [slug, last_activity_at]
            properties:
              slug:
                type: string
                description: owner/name
              last_activity_at:
                type: string
                description: RFC3339, or empty when unknown.
    ReviewFixResult:
      type: object
      description: >
        review.fix {session, file, findings?}, from the review session or the
        operator. Starts a fixer for the findings (all that are not
        Call: disagree when findings is omitted).
      required: [type, session, fixer, findings, start_sha, round]
      properties:
        type:
          type: string
          const: review_fix
        session:
          type: string
          description: The review session's id.
        fixer:
          $ref: "#/components/schemas/Session"
        findings:
          type: array
          items:
            type: string
        start_sha:
          type: string
          description: The staged PR head the fixer starts from.
        round:
          type: integer
          description: 1 to 3.
    ReviewPushResult:
      type: object
      description: >
        review.push {}, from a fixer only; it takes no params. Serve checks
        the commits, the report and the scope, pushes without force, then
        stops the fixer.
      required: [type, sha]
      properties:
        type:
          type: string
          const: review_push
        sha:
          type: string
          description: The pushed commit.
    ReviewAssessResult:
      type: object
      description: >
        review.assess {session, file}. Starts a consult that serve briefs
        itself; a brief param is ignored.
      required: [type, session, consult, head_sha]
      properties:
        type:
          type: string
          const: review_assess
        session:
          type: string
        consult:
          $ref: "#/components/schemas/Session"
        head_sha:
          type: string
    ReviewApprovedResult:
      type: object
      description: >
        review.approve {session, file}. The first call after an approving
        assessment opens gate:approve and is refused with
        gate_needs_operator; the operator closes it, then a second call
        submits APPROVE at the assessed head.
      required: [type, session, head_sha, decision, counts]
      properties:
        type:
          type: string
          const: review_approved
        session:
          type: string
        head_sha:
          type: string
        decision:
          type: string
          description: GitHub's reviewDecision after the post, for example APPROVED.
        counts:
          type: boolean
          description: >
            True only when the decision is APPROVED. False is not an error:
            the approval was posted but does not count, and the operator must
            be told.
    SessionTerminatedResult:
      type: object
      required: [type, session, worktree_removed, branch]
      properties:
        type:
          type: string
          const: session_terminated
        session:
          type: string
        worktree_removed:
          type: boolean
          description: >
            True only for the session's own linked worktree. A main checkout, a
            worktree another session uses, or no worktree stays and is false.
        branch:
          type: string
          description: The branch, which is never deleted; empty on a detached HEAD with no recorded branch.
        worktree_note:
          type: string
          description: Why the worktree stayed, when it did.
        children_left:
          type: array
          description: >
            Running child sessions, which keep running with no parent. Warn
            before confirming; session.list has parent_id.
          items:
            type: string
    AWSStatusResult:
      type: object
      description: >
        aws.status {check?}. One row per profile in the union of this host's
        delegations and the sections of its ~/.aws/credentials. Credential
        values never appear here. A device token may call it; a session may too.
      required: [type, profiles]
      properties:
        type:
          type: string
          const: aws_status
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/AWSProfileStatus"
    AWSProfileStatus:
      type: object
      required: [profile, status, sso_ready]
      properties:
        profile:
          type: string
        status:
          type: string
          description: >
            not_pushed is a delegated profile with no section on the host;
            unmanaged is a section with no delegation and no recorded expiry.
          enum: [valid, expired, not_pushed, unmanaged]
        expires_at:
          type: string
          format: date-time
        expiry_approx:
          type: boolean
          description: expires_at is estimated from the file's age; do not show it as exact.
        sso_ready:
          type: boolean
          description: >
            False when the profile has no delegation or its delegation lacks
            SSO facts. aws.login_start answers invalid_params for the first and
            aws_no_sso for the second.
    AWSLoginResult:
      type: object
      description: >
        aws.login_start {profile} needs allow_destructive on a device token and
        is refused for a session caller. aws.login_status {login_id} is a read.
        A start for a profile with a pending login returns that login.
      required: [type, login]
      properties:
        type:
          type: string
          const: aws_login
        login:
          $ref: "#/components/schemas/AWSLogin"
    AWSLogin:
      type: object
      required: [login_id, profile, state]
      properties:
        login_id:
          type: string
        profile:
          type: string
        state:
          type: string
          enum: [pending, approved, minting, done, denied, expired, failed]
        failure:
          type: string
          description: Set when state is failed.
          enum: [sso_role_denied, write_failed, other]
        expires_at:
          type: string
          format: date-time
          description: When the device code expires. aws.login_start and aws.login_status.
        user_code:
          type: string
          description: aws.login_start only; aws.login_status never returns it.
        verification_uri_complete:
          type: string
          description: The approval URL. aws.login_start only; aws.login_status never returns it.
        expires_in:
          type: integer
          description: Seconds until the device code expires. aws.login_start only.
    AWSLogResult:
      type: object
      description: >
        aws.log {since_seq?, limit?}. The AWS sign-in ledger, oldest first: an
        aws.login_started row per started login and an aws.login_finished row
        per login that ended while serve ran. Rows hold the profile, state and
        failure, never a login id, code, URL or token. A device token may call
        it; a session caller gets needs_operator.
      required: [type, events]
      properties:
        type:
          type: string
          const: aws_log
        events:
          type: array
          items:
            $ref: "#/components/schemas/AWSLogEvent"
    AWSLogEvent:
      type: object
      required: [session_id, seq, at, actor, kind]
      properties:
        session_id:
          type: string
          description: Always aws-login, the ledger id no session owns.
        seq:
          type: integer
          format: int64
          description: Ledger sequence; pass the last one as since_seq to read on.
        at:
          type: string
          format: date-time
        actor:
          type: string
        kind:
          type: string
          enum: [aws.login_started, aws.login_finished]
        payload:
          type: object
          description: '{profile, state} plus failure when the login failed.'
          properties:
            profile:
              type: string
            state:
              type: string
            failure:
              type: string
        hash:
          type: string
          description: sha256 of the payload.
    LimitsResult:
      type: object
      description: >
        limits.get {refresh}. Answers from the cache at once and starts whatever
        is due; refresh skips the age check. Poll while refreshing is true. Device
        tokens cannot call it; they read a session's own provider from Session.limits.
        A serve with no limits manager answers unavailable.
      required: [type, readings, refreshing]
      properties:
        type:
          type: string
          const: limits
        readings:
          type: array
          description: One per source that has finished a run; empty on a fresh serve.
          items:
            $ref: "#/components/schemas/LimitsReading"
        refreshing:
          type: boolean
    LimitsReading:
      type: object
      required: [provider, state]
      properties:
        provider:
          type: string
        plan:
          type: string
        windows:
          type: array
          items:
            type: object
            required: [label, used_percent]
            properties:
              label:
                type: string
              used_percent:
                type: number
                description: Zero once reset is true.
              resets_at:
                type: string
                format: date-time
              resets_text:
                type: string
                description: A reset the provider shows without a year or zone, as printed.
              reset:
                type: boolean
                description: resets_at has passed, so the old percent no longer applies.
        balances:
          type: array
          items:
            type: object
            required: [amount, currency]
            properties:
              amount:
                type: string
              currency:
                type: string
        spend:
          type: string
          description: Money spent, not a limit.
        state:
          type: string
          enum: [ok, unknown, unavailable]
          description: >
            unknown means the source ran and could not read the answer; any numbers
            are from the last good read, aged by observed_at. unavailable means it
            does not apply on this host; an empty reason means the tool is not installed.
        reason:
          type: string
        observed_at:
          type: string
          format: date-time
          description: When the provider said it, not when serve asked.
        source:
          type: string
    HostVersionResult:
      type: object
      description: >
        host.version: the aiman release this host's serve runs and what its
        self-update knows. Any caller may read it. With updates off, mode is
        off, status held and latest empty.
      required: [type, host, version, protocol, latest, latest_ready, mode, status, checked_at, attempt]
      properties:
        type:
          type: string
          const: host_version
        host:
          type: string
        version:
          type: string
          description: The running serve's release, or dev for a local build.
        protocol:
          type: integer
          description: ProtocolVersion, the same integer ping returns.
        latest:
          type: string
          description: Latest GitHub release tag serve has seen; empty when none.
        latest_ready:
          type: boolean
          description: The latest release has checksums.txt and can be installed.
        mode:
          type: string
          enum: ["off", notify, auto]
        status:
          type: string
          enum: [current, available, not_ready, deferred, updating, failed, held, unknown]
        checked_at:
          type: string
          description: RFC3339 time of the last poll, or empty when never polled.
        attempt:
          description: The last install attempt, or null when there is none.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HostUpdateAttempt"
    HostUpdateAttempt:
      type: object
      required: [at, from, to, status, exit, error]
      properties:
        at:
          type: string
          description: RFC3339 time the attempt started.
        from:
          type: string
        to:
          type: string
        status:
          type: string
          enum: [started, ok, failed]
        exit:
          type: integer
          description: The update script's exit code once it ended.
        error:
          type: string
          description: Why a failed attempt failed; empty otherwise.
    HostUpdateResult:
      type: object
      description: >
        host.update: an operator request to install the latest ready release
        now. The install runs in the background and restarts serve and the
        gateway; host.version and the host_update notification report the
        outcome. Needs allow_destructive on a device token; a session caller
        gets needs_operator.
      required: [type, accepted, reason, target]
      properties:
        type:
          type: string
          const: host_update
        accepted:
          type: boolean
        reason:
          type: string
          description: Why the request was refused; empty when accepted.
        target:
          type: string
          description: The release tag being installed when accepted.
    HostStatsResult:
      type: object
      description: >
        Read-only. Every size is in bytes and every CPU value is a percent.
        Linux reads /proc; elsewhere the fields are empty. Refresh every few
        seconds.
      required: [type, host, uptime_seconds, load, cpu_count, cpu_percent, memory, swap, disks, processes, sessions]
      properties:
        type:
          type: string
          const: host_stats
        host:
          type: string
        uptime_seconds:
          type: integer
        load:
          type: array
          description: 1, 5 and 15 minute load averages.
          minItems: 3
          maxItems: 3
          items:
            type: number
        cpu_count:
          type: integer
        cpu_percent:
          type: number
          description: The whole host, 0 to 100.
        memory:
          type: object
          description: Bytes.
          required: [total, used, available]
          properties:
            total:
              type: integer
            used:
              type: integer
            available:
              type: integer
        swap:
          type: object
          description: Bytes.
          required: [total, used]
          properties:
            total:
              type: integer
            used:
              type: integer
        disks:
          type: array
          description: Real local filesystems, one per device. Sizes in bytes.
          items:
            type: object
            required: [mount, total, used]
            properties:
              mount:
                type: string
              total:
                type: integer
              used:
                type: integer
        processes:
          type: array
          description: Top 15 by CPU and top 15 by RSS, merged, busiest first. Names only, never arguments.
          items:
            type: object
            required: [pid, user, name, cpu_percent, rss]
            properties:
              pid:
                type: integer
              user:
                type: string
              name:
                type: string
              cpu_percent:
                type: number
                description: Of one core, so it can pass 100.
              rss:
                type: integer
                description: Bytes.
        sessions:
          type: array
          description: >
            Each running session with its agent's process tree. aiman's hidden
            helpers are left out. A session whose process cannot be confirmed
            reports zeros.
          items:
            type: object
            required: [session, name, cpu_percent, rss, processes]
            properties:
              session:
                type: string
              name:
                type: string
              cpu_percent:
                type: number
                description: Of one core, across the tree.
              rss:
                type: integer
                description: Bytes.
              processes:
                type: integer
    SessionGetResult:
      type: object
      required: [type, session]
      properties:
        type:
          type: string
          const: session
        session:
          $ref: "#/components/schemas/Session"
    PaneReadResult:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          const: pane_read
        session:
          $ref: "#/components/schemas/Session"
        text:
          type: string
    TranscriptPage:
      type: object
      description: >
        One page of session.transcript. Items are newest-last. On a call with
        after, items are new (append), changed are items first seen at or
        before the cursor whose rev moved (replace by id only when loaded),
        and removed are ids that left the active branch; apply removed before
        items. reset means drop the cache: the file was replaced or
        rewritten. A session with no transcript answers source pane with one
        pane item holding the current screen.
      required: [type, session, source, capabilities, items, before, after, reset]
      properties:
        type:
          type: string
          const: transcript
        session:
          type: string
        subagent:
          type: string
        source:
          type: string
          enum: [transcript, pane]
        capabilities:
          $ref: "#/components/schemas/TranscriptCapabilities"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptItem"
        changed:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptItem"
        removed:
          type: array
          items:
            type: string
        before:
          type: [string, "null"]
          description: Opaque cursor for the page above; null at the top.
        after:
          type: string
          description: >
            Opaque cursor to resume from. A reply to a before call carries the
            end of the file: keep the after of the newest page instead.
        reset:
          type: boolean
    TranscriptCapabilities:
      type: object
      required: [agent, scrollback, tool_results, thinking, subagents, processes]
      properties:
        agent:
          type: string
        scrollback:
          type: string
          enum: [transcript, pane]
        tool_results:
          type: boolean
        thinking:
          type: string
          enum: [full, summary, none]
        subagents:
          type: boolean
        processes:
          type: string
          enum: [file, inline, none]
    TranscriptItem:
      type: object
      description: >
        One normalised transcript entry. rev is the position of the last line
        that changed it. text, tool_call.input and tool_call.result are cut at
        64 KiB in a page and 1 MiB in session.transcript_item, with truncated
        set.
      required: [id, kind, at, rev, text, truncated]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [user, assistant, thinking, tool_call, subagent, process, system, pane]
        at:
          type: string
          format: date-time
        rev:
          type: integer
          format: int64
        text:
          type: string
        truncated:
          type: boolean
        hidden:
          type: boolean
          description: A thinking block whose text the vendor redacted.
        tool_call:
          $ref: "#/components/schemas/TranscriptToolCall"
        subagent:
          $ref: "#/components/schemas/TranscriptSubagent"
        process:
          $ref: "#/components/schemas/TranscriptProcess"
    TranscriptToolCall:
      type: object
      required: [tool_id, name, summary, input, result, status]
      properties:
        tool_id:
          type: string
        name:
          type: string
        summary:
          type: string
        input:
          type: string
        result:
          type: string
        status:
          type: string
          enum: [running, ok, error, denied]
        duration_ms:
          type: integer
          format: int64
        subagent_id:
          type: string
        process_id:
          type: string
    TranscriptSubagent:
      type: object
      required: [id, name, description, state, item_count]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [running, done, failed, unknown]
        item_count:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
    TranscriptProcess:
      type: object
      required: [id, command, state, output]
      properties:
        id:
          type: string
          description: The process id session.process_output takes.
        command:
          type: string
        state:
          type: string
          enum: [running, exited, unknown]
        exit_code:
          type: integer
        output:
          type: string
          enum: [file, inline]
    TranscriptItemResult:
      type: object
      required: [type, item]
      properties:
        type:
          type: string
          const: transcript_item
        item:
          $ref: "#/components/schemas/TranscriptItem"
    ProcessOutputResult:
      type: object
      description: >
        At most 256 KiB of a background process's output, from since or the
        tail. A file not created yet answers empty data and state running.
        Codex output is inline: data comes from the process item.
      required: [type, data, offset, size, state, exit_code, truncated]
      properties:
        type:
          type: string
          const: process_output
        data:
          type: string
        offset:
          type: integer
          format: int64
          description: Byte offset of data in the output.
        size:
          type: integer
          format: int64
          description: The output's size when read.
        state:
          type: string
          enum: [running, exited, unknown]
        exit_code:
          type: [integer, "null"]
        truncated:
          type: boolean
          description: More output lies before or after data.
    FileResult:
      type: object
      description: >
        session.file {session, path, offset?, limit?}: one page of a file in
        the session's worktree or working directory. Data is cut on a UTF-8
        boundary, so a client appends pages. A file whose first 8 KiB holds a
        NUL is binary: data is empty and eof true.
      required: [type, session, path, size, offset, data, eof, binary]
      properties:
        type:
          type: string
          const: file
        session:
          type: string
          description: The session id.
        path:
          type: string
          description: The absolute path read, after symlinks.
        size:
          type: integer
          format: int64
          description: The file's size in bytes when read.
        offset:
          type: integer
          format: int64
          description: Byte offset this page starts at.
        data:
          type: string
        eof:
          type: boolean
          description: Data runs to the end of the file.
        binary:
          type: boolean
    PromptResult:
      type: object
      required: [type, sent]
      properties:
        type:
          type: string
          const: prompt_result
        sent:
          type: boolean
          description: >
            False with delivered_as note is success: the text was queued as a
            peer note, not typed.
        state:
          $ref: "#/components/schemas/AgentState"
        queued:
          type: boolean
          description: True when the text was queued as a peer note.
        delivered_as:
          type: string
          enum: [note]
          description: >
            note: a session outside the target's tree sent it; it arrives at
            the target's next prompt as [peer session <id> <name>] <text>.
        steer:
          $ref: "#/components/schemas/SteerStatus"
    SteerStatus:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
        last_delivered_at:
          type: string
          format: date-time
        last_error:
          type: string
        held:
          type: string
          description: Why the last delivery waited (working, dialog, ended, unknown, legacy_terminal).
        pending:
          type: array
          items:
            $ref: "#/components/schemas/SteerNote"
    SteerNote:
      type: object
      required: [session_id, author, text]
      properties:
        session_id:
          type: string
        author:
          type: string
          enum: [user, aiman, verifier, peer]
        from:
          type: string
          description: The sending session of a peer note; absent otherwise.
        text:
          type: string
    PushRegisterResult:
      type: object
      required: [type, registered]
      properties:
        type:
          type: string
          const: push_registered
        registered:
          type: boolean
    PushUnregisterResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: push_unregistered
    SessionEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >
            session_activity, session_gone and session_created come from the
            stream's own poll; todo_changed, steer, usage, usage.budget,
            notify and verify are published by request handlers; transcript
            comes from the stream's poll when a transcript file read within
            the last 2 minutes (or a session's recorded transcript path)
            changes size or mtime, at most once a second per session and
            sub-agent, and means call session.transcript with after; keepalive
            is sent when nothing else was.
          enum:
            - session_activity
            - session_gone
            - session_created
            - todo_changed
            - steer
            - usage
            - usage.budget
            - notify
            - verify
            - transcript
            - keepalive
        id:
          type: string
        title:
          type: string
        last_output:
          type: string
          format: date-time
        title_changed_at:
          type: string
          format: date-time
        output_bytes:
          type: integer
          format: int64
        status:
          type: string
        state:
          $ref: "#/components/schemas/AgentState"
          description: >
            On session_activity, the agent state serve last sampled every 2s,
            from a fresh hook report or the screen rules, and absent until the
            first sample and for hidden helper sessions. The review status on
            verify, and the budget state on usage.budget. The phone merges it
            when present and otherwise keeps the last list/get value.
        state_confidence:
          $ref: "#/components/schemas/StateConfidence"
          description: Sent beside state on session_activity.
        session:
          $ref: "#/components/schemas/Session"
          description: The new or changed session on session_created.
        rev:
          type: integer
          format: int64
          description: >
            To-do list revision on todo_changed; on transcript, the changed
            file's size, a hint only (compare nothing to it).
        subagent:
          type: string
          description: On transcript, the sub-agent whose file moved; absent for the parent.
        queued:
          type: integer
          description: Steering notes still waiting on steer.
        delivered_at:
          type: string
          format: date-time
          description: Set on steer once a note reached the agent.
        kind:
          type: string
          description: Notification kind on notify.
        text:
          type: string
          description: >
            The notification's formatted text on notify, for example
            "serve updated v0.34.0 → v0.35.0 on remote1". It never holds
            terminal text.
    PairRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The 10-character code from the pairing QR. Never log it.
        device_name:
          type: string
    PairResponse:
      type: object
      required: [device_id, token]
      properties:
        device_id:
          type: string
        token:
          type: string
          description: >
            Device bearer token, 32 random bytes as hex. The gateway keeps
            only its sha256. Never log this value.
    Device:
      type: object
      required: [id, name, created_at, allow_destructive]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        login:
          type: string
          description: Tailnet login that paired the device.
        allow_destructive:
          type: boolean
          description: >
            Lets the device call pty.input, pty.create, pty.run, pty.kill,
            pty.forget, session.create, session.restart, session.forget,
            review.post, agents.update, agents.move_prefix and
            aws.login_start, open the terminal WebSocket, and close, drop,
            rename or remove a to-do whose
            ref starts with gate:. Other to-do edits, session.prompt and
            steer.send do not need it.
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    PairingQR:
      type: object
      description: >
        Output of `aiman-gateway pair --json` on the host. Not served over
        HTTP; `uri` is the QR payload the phone scans.
      required: [target, host, code, expires_at, uri]
      properties:
        target:
          type: string
          description: tsnet target, `<node name>:<port>`.
        host:
          type: string
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        uri:
          type: string
          description: "`aimanphone://pair?target=<t>&host=<h>&code=<c>`"
    PushData:
      type: object
      description: The `data` object of every push notification.
      required: [session, host, url]
      properties:
        session:
          type: string
        host:
          type: string
        url:
          type: string
          description: "Deep link `aimanphone://h/<host>/s/<session>`."


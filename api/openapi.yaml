openapi: 3.1.0
info:
  title: aiman gateway
  version: 0.3.0
  description: >
    HTTP and WebSocket surface in front of `aiman serve`. Every request needs
    a bearer token except GET /v1/health and POST /v1/pair. The token is the
    host token (full access, used by the TUI) or a device token minted by
    POST /v1/pair. Device tokens pass a method allowlist on /v1/rpc, deny by
    default; destructive methods also need the device's allow_destructive
    flag. Every request also passes the tailnet identity check. POST /v1/rpc
    is the whole API; REST reads are conveniences over the same socket
    methods.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: rpc
  - name: sessions
  - name: events
  - name: terminal
  - name: pairing
  - name: devices
paths:
  /v1/health:
    get:
      tags: [health]
      security: []
      operationId: health
      summary: Unauthenticated liveness. No version, no session data.
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/pair:
    post:
      tags: [pairing]
      security: []
      operationId: pair
      summary: >
        Redeem a pairing code from `aiman-gateway pair` for a device token.
        Needs no bearer token but still the tailnet identity check. The code
        is single use and valid 5 minutes. More than 5 failed codes in a
        minute lock pairing for the rest of that minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Code consumed; the token is shown only here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          description: Invalid JSON (invalid_params)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: Unknown, used or expired code (invalid_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "403":
          description: No tailnet identity, or login not on the allow-list (forbidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "429":
          description: Pairing locked after too many failed codes (locked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "503":
          description: Pairing is not configured on this gateway (unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Paired devices. Token hashes are never returned.
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: unauthorized
        "403":
          description: forbidden
  /v1/devices/{id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: >
        Revoke a device; its token stops working at once. A device token may
        revoke itself; revoking another device takes the host token or
        allow_destructive.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          description: unauthorized
        "403":
          description: Revoking another device without allow_destructive (forbidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "404":
          description: No such device (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
  /v1/rpc:
    post:
      tags: [rpc]
      operationId: rpc
      summary: JSON-RPC-shaped proxy onto the unix socket, plus gateway-owned push methods.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RpcRequest"
      responses:
        "200":
          description: Socket result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "400":
          description: Invalid JSON, missing method, streaming method used over RPC, or socket-level error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: Missing or wrong bearer token
        "403":
          description: >
            Tailnet WhoIs failed, login not on the allow-list, or a device
            token calling a method outside its allowlist
        "502":
          description: Unix socket call failed
  /v1/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: session.list over GET.
      parameters:
        - in: query
          name: group
          schema:
            type: string
      responses:
        "200":
          description: session.list result wrapped in RpcResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: unauthorized
        "403":
          description: forbidden
  /v1/sessions/{id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: session.get over GET.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: session.get result wrapped in RpcResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "401":
          description: unauthorized
  /v1/sessions/{id}/terminal:
    get:
      tags: [terminal]
      operationId: attachTerminal
      summary: WebSocket bridge of pty.attach. Phone UI is deferred.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: cols
          schema:
            type: integer
            default: 80
        - in: query
          name: rows
          schema:
            type: integer
            default: 24
        - $ref: "#/components/parameters/AccessToken"
      responses:
        "101":
          description: Switching protocols
        "401":
          description: unauthorized
  /v1/events:
    get:
      tags: [events]
      operationId: sessionEvents
      summary: >
        WebSocket of SessionEvent objects, one JSON text frame per event.
        Events are changes, not snapshots. Expect a keepalive roughly every 20s.
      parameters:
        - $ref: "#/components/parameters/AccessToken"
      responses:
        "101":
          description: Switching protocols
        "401":
          description: unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccessToken:
      in: query
      name: access_token
      required: false
      description: >
        Bearer token for WebSocket clients that cannot set a header. URLs
        carrying it are never logged.
      schema:
        type: string
    SessionId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    AgentState:
      type: string
      enum:
        - waiting_input
        - working
        - waiting_background
        - idle
        - exited
        - errored
        - unknown
    StateConfidence:
      type: string
      enum: [high, low]
    Session:
      type: object
      required: [id, name, group, self]
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        parent_id:
          type: string
          description: The session that created this one; empty for a top-level session.
        role:
          type: string
          description: >
            Empty for an ordinary session. reviewer, handover and consult are
            aiman's hidden helpers: session.restart and session.terminate
            refuse them.
        issue_key:
          type: string
        branch:
          type: string
        base_branch:
          type: string
          description: The ref the session's branch was cut from.
        repo_name:
          type: string
        tmux_session:
          type: string
          description: Terminal name; key kept for compatibility.
        worktree_path:
          type: string
        working_directory:
          type: string
        agent_name:
          type: string
        launch_model:
          type: string
          description: Model this session launches with; empty is the agent's default.
        launch_effort:
          type: string
        agent_session_id:
          type: string
        agent_session_path:
          type: string
        title:
          type: string
          description: Agent-set terminal title; the one-line "what is it doing".
        status:
          type: string
        state:
          $ref: "#/components/schemas/AgentState"
        state_confidence:
          $ref: "#/components/schemas/StateConfidence"
        state_message:
          type: string
        state_source:
          type: string
        ended:
          type: boolean
        self:
          type: boolean
    RpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Serve's codes, plus invalid_code, locked, forbidden and internal,
            which the gateway returns itself. unavailable comes from either;
            from serve it means repo.list failed with nothing cached.
            worktree_dirty refuses session.terminate while removing the
            worktree would lose work, and data says what. needs_operator
            refuses a session's call to session.restart or session.terminate.
            legacy_terminal refuses both on a legacy tmux row. A serve older
            than this spec answers a method it does not have with
            invalid_params and the message "unknown method <name>"; an older
            gateway answers a method missing from its allowlist with
            forbidden.
          enum:
            - invalid_params
            - not_found
            - name_taken
            - server_not_running
            - already_running
            - agent_blocked
            - timeout
            - create_failed
            - publish_failed
            - jira_unavailable
            - protocol_mismatch
            - no_reviewer_agent
            - no_preferred_agent
            - legacy_terminal
            - gate_needs_operator
            - design_not_approved
            - consult_needs_smart
            - review_exists
            - review_not_ready
            - review_incomplete
            - review_head_moved
            - review_already_posted
            - review_no_coverage
            - worktree_dirty
            - needs_operator
            - invalid_code
            - locked
            - forbidden
            - unavailable
            - internal
        message:
          type: string
        data:
          description: The refusal's detail, for the codes that have one.
          oneOf:
            - $ref: "#/components/schemas/WorktreeDirtyData"
    WorktreeDirtyData:
      type: object
      description: >
        What removing the worktree would lose. aiman's own scaffolding
        (.aiman_* files, the bundled skill, graphify-out, its .gitignore rule)
        does not count, and neither do files the repository ignores, which
        removal also deletes.
      required: [changed_files, paths, unpushed_commits]
      properties:
        changed_files:
          type: integer
          description: Uncommitted and untracked files, all of them.
        paths:
          type: array
          maxItems: 20
          description: Up to 20 of the changed files.
          items:
            type: string
        unpushed_commits:
          type: integer
          description: Commits on HEAD that no remote-tracking ref contains.
    RpcRequest:
      type: object
      required: [method]
      properties:
        id:
          type: string
        method:
          type: string
          description: >
            Every method serve answers on its socket, plus push.register and
            push.unregister, which the gateway answers itself. Device tokens
            reach only the allowlisted subset; the rest return 403.
          enum:
            - ping
            - session.list
            - session.get
            - session.read
            - session.log
            - session.replay
            - session.prompt
            - session.wait
            - session.create
            - session.rename
            - session.move
            - session.forget
            - session.restart
            - session.terminate
            - repo.list
            - host.stats
            - session.register
            - session.report_agent_session
            - notify.since
            - verify.start
            - verify.status
            - ci.get
            - ci.watch
            - context.put
            - context.get
            - context.list
            - context.find
            - context.pack
            - context.stats
            - context.verify
            - usage.get
            - agents.status
            - agents.update
            - agents.move_prefix
            - design.publish
            - review.reveal
            - review.post
            - review.refresh
            - review.run
            - review.debug
            - review.coverage
            - handover.write
            - handover.point
            - memory.jobs
            - memory.done
            - todo.get
            - todo.summary
            - todo.add
            - todo.update
            - todo.move
            - todo.remove
            - todo.mirror
            - todo.ensure_done
            - todo.mark_met
            - todo.gate
            - todo.approve_design
            - todo.approve_review
            - steer.send
            - pty.create
            - pty.list
            - pty.get
            - pty.input
            - pty.run
            - pty.wait-output
            - pty.capture
            - pty.resize
            - pty.kill
            - pty.forget
            - push.register
            - push.unregister
        params:
          $ref: "#/components/schemas/RpcParams"
    StreamMethod:
      type: string
      description: >
        Socket methods that take over the connection instead of answering
        once. /v1/rpc refuses them; pty.attach is reached through
        /v1/sessions/{id}/terminal and session.events through /v1/events.
      enum:
        - pty.attach
        - session.events
    RpcParams:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        group:
          type: string
        lines:
          type: integer
        text:
          type: string
        force:
          type: boolean
          description: >
            Override the default refusal. Phone UX confirms before sending
            force true. Against today's unix socket, answering a
            waiting_input session also requires force true.
        token:
          type: string
          description: Expo push token. Never log this value.
        session:
          type: string
          description: >
            Target of session.restart and session.terminate (id or name). Every
            method that takes id also takes session; id wins when both are sent.
        discard:
          type: boolean
          description: >
            session.terminate: remove a linked worktree even though it holds
            uncommitted changes or unpushed commits (git worktree remove
            --force). The branch is never deleted. Send it only after showing
            the worktree_dirty data and confirming.
        agent:
          type: string
          description: >
            session.create: agent command from agents.status; empty picks from
            the model tiers. session.restart: required; a different agent than
            the session's is a switch, which clears the launch model, effort and
            vendor identity, and an agent not installed is invalid_params.
        model:
          type: string
          description: >
            Launch model for session.create and session.restart. Needs agent on
            create. On a same-agent restart, empty keeps the session's model.
        effort:
          type: string
          description: Launch effort, with the same rules as model.
        repo:
          type: string
          description: session.create, owner/name from repo.list. Required unless quick.
        branch:
          type: string
          description: session.create. Required unless quick.
        existing_branch:
          type: boolean
          description: session.create starts from this existing branch instead of cutting one.
        base:
          type: string
          description: session.create, the ref to cut the branch from.
        quick:
          type: boolean
          description: session.create, an ad-hoc session with no repository or worktree.
        prompt:
          type: string
          description: session.create, the agent's first prompt, delivered before create answers.
        name:
          type: string
          description: session.create or session.rename; session.create assigns one when empty.
        tier:
          type: string
          enum: [smart, worker]
          description: session.create, exclusive with agent. A session the user starts defaults to smart.
        dir:
          type: string
          description: session.create, the subdirectory the agent starts in.
        issue:
          type: string
          description: session.create, the JIRA key.
        device_id:
          type: string
        states:
          type: array
          items:
            $ref: "#/components/schemas/AgentState"
    RpcResponse:
      type: object
      properties:
        id:
          type: string
        result:
          oneOf:
            - $ref: "#/components/schemas/PongResult"
            - $ref: "#/components/schemas/SessionListResult"
            - $ref: "#/components/schemas/SessionGetResult"
            - $ref: "#/components/schemas/PaneReadResult"
            - $ref: "#/components/schemas/PromptResult"
            - $ref: "#/components/schemas/PushRegisterResult"
            - $ref: "#/components/schemas/PushUnregisterResult"
            - $ref: "#/components/schemas/RepoListResult"
            - $ref: "#/components/schemas/SessionTerminatedResult"
            - $ref: "#/components/schemas/HostStatsResult"
            - $ref: "#/components/schemas/AgentsStatusResult"
        error:
          $ref: "#/components/schemas/RpcError"
    PongResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pong
        version:
          type: string
        protocol:
          type: integer
    SessionListResult:
      type: object
      required: [type, sessions]
      properties:
        type:
          type: string
          const: session_list
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    AgentsStatusResult:
      type: object
      required: [type, host, mode, window, agents]
      properties:
        type:
          type: string
          const: agents
        host:
          type: string
        mode:
          type: string
        window:
          type: string
        agents:
          type: array
          items:
            type: object
            required: [agent, status]
            properties:
              agent:
                type: string
                description: The command session.create and session.restart take.
              status:
                type: string
              models:
                type: array
                description: >
                  The agent's launch catalog. Absent for an agent with no fixed
                  list, such as Pi, which lists its models at run time.
                items:
                  type: string
    RepoListResult:
      type: object
      description: >
        Cached for 5 minutes. A failed refresh serves the last list; a failure
        with nothing cached is unavailable.
      required: [type, repos]
      properties:
        type:
          type: string
          const: repos
        repos:
          type: array
          items:
            type: object
            required: [slug, last_activity_at]
            properties:
              slug:
                type: string
                description: owner/name
              last_activity_at:
                type: string
                description: RFC3339, or empty when unknown.
    SessionTerminatedResult:
      type: object
      required: [type, session, worktree_removed, branch]
      properties:
        type:
          type: string
          const: session_terminated
        session:
          type: string
        worktree_removed:
          type: boolean
          description: >
            True only for the session's own linked worktree. A main checkout, a
            worktree another session uses, or no worktree stays and is false.
        branch:
          type: string
          description: The branch, which is never deleted; empty on a detached HEAD with no recorded branch.
        worktree_note:
          type: string
          description: Why the worktree stayed, when it did.
        children_left:
          type: array
          description: >
            Running child sessions, which keep running with no parent. Warn
            before confirming; session.list has parent_id.
          items:
            type: string
    HostStatsResult:
      type: object
      description: >
        Read-only. Every size is in bytes and every CPU value is a percent.
        Linux reads /proc; elsewhere the fields are empty. Refresh every few
        seconds.
      required: [type, host, uptime_seconds, load, cpu_count, cpu_percent, memory, swap, disks, processes, sessions]
      properties:
        type:
          type: string
          const: host_stats
        host:
          type: string
        uptime_seconds:
          type: integer
        load:
          type: array
          description: 1, 5 and 15 minute load averages.
          minItems: 3
          maxItems: 3
          items:
            type: number
        cpu_count:
          type: integer
        cpu_percent:
          type: number
          description: The whole host, 0 to 100.
        memory:
          type: object
          description: Bytes.
          required: [total, used, available]
          properties:
            total:
              type: integer
            used:
              type: integer
            available:
              type: integer
        swap:
          type: object
          description: Bytes.
          required: [total, used]
          properties:
            total:
              type: integer
            used:
              type: integer
        disks:
          type: array
          description: Real local filesystems, one per device. Sizes in bytes.
          items:
            type: object
            required: [mount, total, used]
            properties:
              mount:
                type: string
              total:
                type: integer
              used:
                type: integer
        processes:
          type: array
          description: Top 15 by CPU and top 15 by RSS, merged, busiest first. Names only, never arguments.
          items:
            type: object
            required: [pid, user, name, cpu_percent, rss]
            properties:
              pid:
                type: integer
              user:
                type: string
              name:
                type: string
              cpu_percent:
                type: number
                description: Of one core, so it can pass 100.
              rss:
                type: integer
                description: Bytes.
        sessions:
          type: array
          description: >
            Each running session with its agent's process tree. aiman's hidden
            helpers are left out. A session whose process cannot be confirmed
            reports zeros.
          items:
            type: object
            required: [session, name, cpu_percent, rss, processes]
            properties:
              session:
                type: string
              name:
                type: string
              cpu_percent:
                type: number
                description: Of one core, across the tree.
              rss:
                type: integer
                description: Bytes.
              processes:
                type: integer
    SessionGetResult:
      type: object
      required: [type, session]
      properties:
        type:
          type: string
          const: session
        session:
          $ref: "#/components/schemas/Session"
    PaneReadResult:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          const: pane_read
        session:
          $ref: "#/components/schemas/Session"
        text:
          type: string
    PromptResult:
      type: object
      required: [type, sent]
      properties:
        type:
          type: string
          const: prompt_result
        sent:
          type: boolean
        state:
          $ref: "#/components/schemas/AgentState"
    PushRegisterResult:
      type: object
      required: [type, registered]
      properties:
        type:
          type: string
          const: push_registered
        registered:
          type: boolean
    PushUnregisterResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: push_unregistered
    SessionEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >
            session_activity, session_gone and session_created come from the
            stream's own poll; todo_changed, steer, usage, usage.budget,
            notify and verify are published by request handlers; keepalive
            is sent when nothing else was.
          enum:
            - session_activity
            - session_gone
            - session_created
            - todo_changed
            - steer
            - usage
            - usage.budget
            - notify
            - verify
            - keepalive
        id:
          type: string
        title:
          type: string
        last_output:
          type: string
          format: date-time
        title_changed_at:
          type: string
          format: date-time
        output_bytes:
          type: integer
          format: int64
        status:
          type: string
        state:
          $ref: "#/components/schemas/AgentState"
          description: >
            Hook-reported agent state on session_activity, the review status
            on verify, and the budget state on usage.budget. The phone merges
            it when present and otherwise keeps the last list/get value.
        state_confidence:
          $ref: "#/components/schemas/StateConfidence"
        session:
          $ref: "#/components/schemas/Session"
          description: The new or changed session on session_created.
        rev:
          type: integer
          format: int64
          description: To-do list revision on todo_changed.
        queued:
          type: integer
          description: Steering notes still waiting on steer.
        delivered_at:
          type: string
          format: date-time
          description: Set on steer once a note reached the agent.
        kind:
          type: string
          description: Notification kind on notify.
    PairRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The 10-character code from the pairing QR. Never log it.
        device_name:
          type: string
    PairResponse:
      type: object
      required: [device_id, token]
      properties:
        device_id:
          type: string
        token:
          type: string
          description: >
            Device bearer token, 32 random bytes as hex. The gateway keeps
            only its sha256. Never log this value.
    Device:
      type: object
      required: [id, name, created_at, allow_destructive]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        login:
          type: string
          description: Tailnet login that paired the device.
        allow_destructive:
          type: boolean
          description: >
            Lets the device call pty.kill, pty.forget, session.forget,
            review.post, agents.update and agents.move_prefix.
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    PairingQR:
      type: object
      description: >
        Output of `aiman-gateway pair --json` on the host. Not served over
        HTTP; `uri` is the QR payload the phone scans.
      required: [target, host, code, expires_at, uri]
      properties:
        target:
          type: string
          description: tsnet target, `<node name>:<port>`.
        host:
          type: string
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        uri:
          type: string
          description: "`aimanphone://pair?target=<t>&host=<h>&code=<c>`"
    PushData:
      type: object
      description: The `data` object of every push notification.
      required: [session, host, url]
      properties:
        session:
          type: string
        host:
          type: string
        url:
          type: string
          description: "Deep link `aimanphone://h/<host>/s/<session>`."


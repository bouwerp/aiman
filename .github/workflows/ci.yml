name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The compatibility test compares against the previous release tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        env:
          AIMAN_TEST_DOCKER: "1"
        run: go test -v -race -timeout 20m -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  eval:
    name: Eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run harness evals
        run: make eval

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Uses the Makefile so the pinned version cannot drift from what a
      # developer gets locally.
      - name: Run golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binaries
        run: CGO_ENABLED=0 go build -v ./cmd/aiman ./cmd/aiman-trigger ./cmd/aiman-gateway

      # The release matrix cross-compiles Windows from Linux. Catch GOOS-specific
      # syscall use here instead of after a tag is pushed.
      - name: Cross-compile Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/aiman-windows.exe ./cmd/aiman
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/aiman-trigger-windows.exe ./cmd/aiman-trigger
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/aiman-gateway-windows.exe ./cmd/aiman-gateway

  bun-dap:
    name: bun-dap pin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Builds Bun's debug adapter with the pinned Bun and fails unless it
      # equals tools.BunDAPSHA256, so a change to build/bun-dap needs a new pin
      # before a release builds the asset.
      - name: Build and check
        run: build/bun-dap/check.sh dist

  artifact-kit:
    name: Artifact kit and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/console/package-lock.json

      # The kit test imports playwright from the repository root; it skips
      # when playwright cannot be resolved, so the check below fails instead.
      - name: Install Playwright Chromium
        run: |
          npm ci --prefix e2e/console
          (cd e2e/console && npx playwright install --with-deps chromium)
          ln -s e2e/console/node_modules node_modules
          node -e "import('playwright').then(() => console.log('playwright resolves'))"

      - name: Check font sums
        working-directory: internal/artifact/kit/fonts
        run: |
          sed -n 's/^| `@fontsource[^|]*|[^|]*| `\([^`]*\)` | `\([0-9a-f]\{64\}\)` |$/\2  \1/p' SOURCES.md > /tmp/fonts.sha256
          test "$(wc -l < /tmp/fonts.sha256)" -eq "$(ls *.woff2 | wc -l)"
          sha256sum -c /tmp/fonts.sha256
          ./font-face.sh --check

      - name: Worker test
        run: node --test internal/artifact/worker/worker_test.mjs

      - name: Kit test
        shell: bash
        run: |
          node --test --test-reporter=tap internal/artifact/kit/kit_test.mjs | tee /tmp/kit.tap
          grep -q '^# skipped 0$' /tmp/kit.tap
